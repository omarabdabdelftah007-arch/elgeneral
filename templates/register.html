{% extends 'home.html' %}

{% block content %}
<style>
    /* التوسيط وضبط الحاوية الخارجية */
    .register-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 120px);
        padding: 40px 15px;
        box-sizing: border-box;
        width: 100%;
    }

    .register-card {
        background: var(--ink-2, #18181b);
        border: 1px solid var(--line-soft, rgba(255, 255, 255, 0.1));
        border-radius: 12px;
        padding: clamp(24px, 5vw, 40px);
        width: 100%;
        max-width: 650px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        color: var(--paper, #f4f4f5);
        direction: rtl;
        box-sizing: border-box;
    }

    /* الهيدر */
    .register-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .register-header .eyebrow {
        font-size: 0.85rem;
        letter-spacing: 2px;
        color: var(--copper-light, #d97706);
        font-weight: 700;
        text-transform: uppercase;
        display: block;
        margin-bottom: 6px;
    }

    .register-header h2 {
        font-family: var(--serif, serif);
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        margin: 0;
        color: var(--paper, #ffffff);
    }

    .alert-error {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid #ef4444;
        color: #fca5a5;
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: right;
        font-size: 0.9rem;
    }

    /* العناوين والصفوف */
    .form-section-title {
        color: var(--copper-light, #f59e0b);
        font-size: 0.9rem;
        font-weight: 700;
        border-bottom: 1px solid var(--line-soft, rgba(255, 255, 255, 0.1));
        padding-bottom: 8px;
        margin: 28px 0 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: right;
    }

    .form-row {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
    }

    @media (max-width: 550px) {
        .form-row {
            flex-direction: column;
            gap: 16px;
        }
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        width: 100%;
        text-align: right;
    }

    .form-group label {
        font-size: 0.82rem;
        color: var(--muted, #a1a1aa);
    }

    .input-wrapper {
        position: relative;
        width: 100%;
    }

    /* مدخلات البيانات */
    .register-card input,
    .register-card select {
        width: 100%;
        padding: 12px 16px;
        border-radius: 6px;
        border: 1px solid var(--line, rgba(255, 255, 255, 0.15));
        background: var(--ink, #09090b);
        color: var(--paper, #ffffff);
        font-size: 0.92rem;
        font-family: var(--sans, sans-serif);
        transition: all 0.25s ease;
        box-sizing: border-box;
    }

    .register-card input:focus,
    .register-card select:focus {
        border-color: var(--copper-light, #f59e0b);
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        outline: none;
    }

    .password-toggle-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--muted, #a1a1aa);
        transition: color 0.2s ease;
    }

    .password-toggle-icon:hover {
        color: var(--copper-light, #f59e0b);
    }

    /* الزرار والفوتر */
    .btn-submit {
        background: var(--copper, #d97706);
        color: #000;
        border: none;
        border-radius: 6px;
        padding: 14px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        width: 100%;
        margin-top: 32px;
        transition: background 0.3s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
        background: var(--copper-light, #f59e0b);
        transform: translateY(-1px);
    }

    .login-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 0.88rem;
        color: var(--muted, #a1a1aa);
    }

    .login-footer a {
        color: var(--copper-light, #f59e0b);
        text-decoration: none;
        font-weight: 700;
    }
</style>

<div class="register-wrapper">
    <div class="register-card">
        <div class="register-header">
            <span class="eyebrow">إنشاء حساب جديد</span>
            <h2>انضم لكتيبة الجنرال</h2>
        </div>

        {% if error_message %}
            <div class="alert-error">
                ⚠️ {{ error_message }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}

            <!-- 1. بيانات الطالب -->
            <div class="form-section-title">
                <i class="fas fa-user"></i> بيانات الطالب
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>اسم الطالب بالكامل</label>
                    <input type="text" name="full_name" placeholder="أدخل اسمك الثلاثي أو الرباعي" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>اسم المستخدم (English)</label>
                    <input type="text" name="username" placeholder="مثال: ahmed_10" required>
                </div>

                <div class="form-group">
                    <label>كلمة السر</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="student_pass" placeholder="••••••••" required>
                        <i class="fas fa-eye password-toggle-icon" id="icon_student" onclick="togglePass('student_pass', 'icon_student')"></i>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>رقم موبايل الطالب</label>
                    <input type="tel" name="phone" placeholder="01XXXXXXXXX" required>
                </div>
            </div>

            <!-- 2. بيانات ولي الأمر -->
            <div class="form-section-title">
                <i class="fas fa-user-shield"></i> بيانات ولي الأمر
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>رقم هاتف ولي الأمر</label>
                    <input type="tel" name="parent_phone" placeholder="01XXXXXXXXX" required>
                </div>
            </div>

            <!-- 3. البيانات الدراسية -->
            <div class="form-section-title">
                <i class="fas fa-graduation-cap"></i> البيانات الدراسية
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>الصف الدراسي</label>
                    <select name="grade" required>
                        <option value="" disabled selected>اختر الصف</option>
                        <option value="1">الصف الأول الثانوي</option>
                        <option value="2">الصف الثاني الثانوي</option>
                        <option value="3">الصف الثالث الثانوي</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>النظام التعليمي</label>
                    <select name="system" required>
                        <option value="" disabled selected>اختر النظام</option>
                        <option value="general">عام</option>
                        <option value="azhar">أزهري</option>
                        <option value="bakaloria">بكالوريا</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>المحافظة</label>
                    <input type="text" name="governorate" placeholder="أدخل محافظتك (مثال: القاهرة)" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">إنشاء الحساب الآن</button>
        </form>

        <div class="login-footer">
            لديك حساب بالفعل؟ <a href="{% url 'login' %}">سجل دخولك هنا</a>
        </div>
    </div>
</div>

<script>
function togglePass(inputId, iconId) {
    const passInput = document.getElementById(inputId);
    const passIcon = document.getElementById(iconId);

    if (passInput.type === 'password') {
        passInput.type = 'text';
        passIcon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        passInput.type = 'password';
        passIcon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
{% endblock %}
