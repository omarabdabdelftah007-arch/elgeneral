{% extends 'home.html' %}

{% block content %}
<style>
    .register-container {
        background: var(--ink-2);
        border: 1px solid var(--line-soft);
        padding: clamp(28px, 5vw, 44px);
        width: 95%;
        max-width: 600px;
        margin: clamp(20px, 4vw, 40px) auto;
        text-align: center;
        color: var(--paper);
    }

    .register-container .eyebrow {
        font-size: 0.8rem;
        letter-spacing: 3px;
        color: var(--copper-light);
        font-weight: 600;
        display: block;
        margin-bottom: 8px;
    }

    .register-container h2 {
        font-family: var(--serif);
        color: var(--paper);
        margin: 0 0 30px;
        font-size: clamp(1.5rem, 4vw, 1.9rem);
    }

    .form-section-title {
        color: var(--copper-light);
        text-align: right;
        margin: 26px 2px 14px;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 1px;
        border-bottom: 1px solid var(--line-soft);
        padding-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .form-section-title:first-of-type { margin-top: 4px; }

    .form-group { margin-bottom: 14px; text-align: right; position: relative; }

    .register-container input,
    .register-container select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 2px;
        border: 1px solid var(--line);
        background: var(--ink);
        color: var(--paper);
        text-align: center;
        font-size: 0.92rem;
        font-family: var(--sans);
        transition: border-color 0.25s ease;
        appearance: none;
        -webkit-appearance: none;
    }
    .register-container input::placeholder { color: var(--muted); }
    .register-container select { cursor: pointer; }
    .register-container select option { background: var(--ink); color: var(--paper); }

    .register-container input:focus,
    .register-container select:focus {
        border-color: var(--copper);
        outline: none;
    }

    .password-toggle-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--copper-light);
        font-size: 1rem;
        transition: color 0.25s ease;
    }
    .password-toggle-icon:hover { color: var(--paper); }

    .btn-register {
        background: var(--copper);
        color: var(--ink);
        border: none;
        padding: 15px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        width: 100%;
        margin-top: 26px;
        transition: background 0.3s ease, color 0.3s ease;
    }
    .btn-register:hover { background: var(--wine); color: var(--paper); }

    .login-link {
        margin-top: 22px;
        color: var(--muted);
        font-size: 0.86rem;
    }
    .login-link a { color: var(--copper-light); text-decoration: none; font-weight: 700; }
    .login-link a:hover { color: var(--paper); }

    .error-msg {
        color: var(--wine-light);
        font-size: 0.76rem;
        margin-top: 5px;
        display: block;
    }
</style>

<div class="register-container reveal">
    <span class="eyebrow">إنشاء حساب</span>
    <h2>انضم لكتيبة الجنرال</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-section-title"><i class="fas fa-user"></i> بيانات الطالب الشخصية</div>
        <div class="form-group">
            <input type="text" name="username" placeholder="اسم مستخدم الطالب (بالإنجليزي)" required>
            {% if form.username.errors %}<span class="error-msg">{{ form.username.errors }}</span>{% endif %}
        </div>

       
        <div class="form-group">
            <input type="password" name="password" id="student_pass" placeholder="كلمة سر حساب الطالب" required>
            <i class="fas fa-eye password-toggle-icon" id="icon_student" onclick="togglePass('student_pass', 'icon_student')"></i>
        </div>

        <div class="form-group">
            <input type="tel" name="phone" placeholder="رقم موبايل الطالب" required>
        </div>

        <div class="form-section-title"><i class="fas fa-user-shield"></i> بيانات ولي الأمر</div>
       

        <div class="form-group">
            <input type="tel" name="parent_phone" placeholder="رقم موبايل ولي الأمر" required>
        </div>

        <div class="form-section-title"><i class="fas fa-graduation-cap"></i> البيانات الدراسية</div>
        <div class="form-group">
            <select name="grade" required>
                <option value="" disabled selected>اختر سنتك الدراسية</option>
                <option value="1">الصف الأول الثانوي</option>
                <option value="2">الصف الثاني الثانوي</option>
                <option value="3">الصف الثالث الثانوي</option>
            </select>
        </div>

        <div class="form-group">
            <select name="system" required>
                <option value="" disabled selected>النظام التعليمي</option>
                <option value="general">عام</option>
                <option value="azhar">أزهري</option>
                <option value="bakaloria">بكالوريا</option>
            </select>
        </div>

        <div class="form-group">
            <input type="text" name="governorate" placeholder="المحافظة" required>
        </div>

        <button type="submit" class="btn-register">إنشاء الحسابات الآن</button>
    </form>

    <div class="login-link">
        لديك حساب بالفعل؟ <a href="{% url 'login' %}">سجل دخولك هنا</a>
    </div>
</div>

<script>
function togglePass(inputId, iconId) {
    const passInput = document.getElementById(inputId);
    const passIcon = document.getElementById(iconId);

    if (passInput.type === 'password') {
        passInput.type = 'text';
        passIcon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        passInput.type = 'password';
        passIcon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
{% endblock %}
